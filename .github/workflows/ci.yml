name: Docker Selenium Grid CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  docker-selenium-grid:
    name: Execute Tests on Docker Selenium Grid
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Start Docker Selenium Grid
        run: docker compose up -d

      - name: Wait for Grid Readiness
        run: sleep 5

      - name: Execute Selenium Tests on Docker Grid
        run: mvn clean test -Dexecution_env=grid -Dheadless=true

      - name: Stop Docker Selenium Grid
        if: always()
        run: docker compose down

      - name: Upload Test Output Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-test-output
          path: test-output/
          retention-days: 7
