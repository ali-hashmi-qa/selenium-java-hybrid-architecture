name: Cross-Platform Selenium CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  selenium-automation-tests:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Execute Selenium Tests
        run: mvn clean test -Dheadless=true

      - name: Upload Test Output Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-test-output-${{ matrix.os }}
          path: test-output/
          retention-days: 7